<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex box</title>
    <style>
        .my_border{
            display: flex;
            padding: 5px;
            border: 1px solid black;
            margin: 5px;
            gap:50px;
        }
        div{
            border:2px solid gold;
        }
        #container1{
            height: 100px;
            width:300px;
            /* flex-direction: column; */
            /* flex-wrap: wrap; */
            justify-content: flex-start;
            align-items: flex-end;
        }
        #container2{
            height:200px;
            width:400px;
            flex-direction: row-reverse;
            justify-content: flex-end;
            align-items: center;
        }
        #container3{
            height:200px;
            width:100px;
            flex-direction: column-reverse;
            justify-content: center;
            align-items: center;
        }
        #container4{
            height: 50px;
            justify-content: space-between;
        }
        #container5{
            justify-content: space-around;
        }

    </style>
</head>
<body>
    <div id="container1" class="my_border" >
        <div>container1</div>
        <div>flex</div>
        <div>start</div>
    </div>
     <div id="container2" class="my_border">
        <div>container2</div>
        <div>flex</div>
        <div>end</div>
     </div>
      <div id="container3" class="my_border">
        <div>container3</div>
        <div>center</div>
        <div>flex</div>
      </div>
       <div id="container4" class="my_border">
        <div>container4</div>
        <div>space</div>
        <div>between</div>
       </div>
        <div id="container5" class="my_border">
            <div>container5</div>
            <div>space</div>
            <div>around</div>
        </div>
</body>
</html>
