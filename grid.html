<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Layout</title>
    <style>
      .container {
        display: grid;
        border: 2px solid black;
        grid-template-columns: auto auto auto;
        grid-template-rows: 1fr 2fr 1fr 1fr;
        padding: 10px;
        gap: 10px;
        /* justify-content: center; */
      }
      img {
        width: 300px;
        height: 180px;
      }
      .box {
        /* width: 10%;
            height: 60%; */
        border: 2px solid purple;
        text-align: center;
        padding: 10px;
      }
      #box1 {
        grid-column-start: 1;
        grid-column-end: 3;
      }
      #box2 {
        grid-row-start: 2;
        grid-row-end: 4;
      }
      #box8 {
        grid-column: 1 / span 3;
      }

      .wrapper {
        display: grid;
        border: 2px solid black;
        gap: 10px;
        padding: 10px;
        grid-template-columns: 1fr 3fr;

        /* justify-content: end; */
      }
      .container1 {
        display: grid;
        border: 2px solid black;
        gap: 10px;
        padding: 10px;
        grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
        /* grid-template-columns: auto auto auto auto auto; */
        justify-content: end;
      }

      .item {
        border: 2px solid black;
        width: 50%;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box" id="box1">
        <!-- <img src="1.jpeg" alt=""> -->
        <h1>Box 1</h1>
      </div>
      <div class="box" id="box2">
        <!-- <img src="2.jpeg" alt=""> -->
        <h1>Box 2</h1>
      </div>
      <div class="box" id="box3">
        <!-- <img src="3.jpeg" alt=""> -->
        <h1>Box 3</h1>
      </div>
      <div class="box" id="box4">
        <!-- <img src="4.png" alt=""> -->
        <h1>Box 4</h1>
      </div>
      <div class="box" id="box5">
        <!-- <img src="5.jpeg" alt=""> -->
        <h1>Box5</h1>
      </div>
      <div class="box" id="box6">
        <!-- <img src="6.png" alt=""> -->
        <h1>Box 6</h1>
      </div>
      <div class="box" id="box7">
        <!-- <img src="7.jpeg" alt=""> -->
        <h1>Box 7</h1>
      </div>
      <div class="box" id="box8">
        <!-- <img src="8.png" alt=""> -->
        <h1>Box 8</h1>
      </div>
    </div>
    <div class="wrapper">
      <div class="item">Pradeep</div>
      <div class="container1">
        <div class="item" id="id1">Home</div>
        <div class="item" id="id2">About</div>
        <div class="item" id="id3">Contact</div>
        <div class="item" id="id4">Skills</div>
        <div class="item" id="id5">Education</div>
      </div>
    </div>
  </body>
</html>
