<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop in JavaScript</title>
</head>
<body>
    <p id="demo"></p>
    <button id="mybutton" >Change the upper text using innerHTML</button>
    <br><br>
    
    <div id="div1">Here will be example of for loop</div>
    <div id="div2">I want to change this content.</div>
    <button id="button2" >Change the upper text using innerText</button>
    <br><br>
    <button id="button1" >Click me to see for loop</button>
    
    <script >
        
           document.getElementById("demo").innerHTML ="Hello I am Pradeep";
           document.write("<br>I want to learn web development.");
           
           console.log("Good Morning");

           document.getElementById("mybutton").addEventListener("click",show);

           function show(){
            document.getElementById("demo").innerHTML = "JavaScript is fun...";
           }

            document.getElementById("button2").addEventListener("click",changeText);
            function changeText(){
                document.getElementById("div2").innerText="Changed the content ";
              }

           document.getElementById("button1").addEventListener("click",showForLoop);
           function showForLoop(){
            document.getElementById("div1").innerHTML= forloop();
           }

           

           function forloop() {
            //for loop
           let age = 23;
           let year = 2025;
           for(let index=0; index<5;index++){
            document.write("<br>I will be "+ age +" years old in "+ year+"<br>");
            age= age + 1;
            year = year + 1;

           }
            }
          
           

           document.write("<br>Example of while loop<br>");
            //while loop
            let sem=["1st sem","2nd sem","3rd sem","4th sem","5th sem","6th sem","7th sem","8th sem"];
            let score=[404, 355, 377, 347, 416, 512, 523, 534];

            let total=0;
            let index=0;
            while(total<=1500)
           {
            document.write("I obtained "+ score[index] +" marks in "+ sem[index] +"<br>");
            total = total + score[index];
            document.write("Total="+ total +"<br>");
            index++;
           }
           document.write("example of foreach loop");

              //forEach loop
              let array = [1, 2, 3, 4, 5];
              let count = 0;
              array.forEach(element => {
                document.write("<br>"+element*2 + "<br>"); 
               if (count ==3){
                return;
               }
                count++;
              });


        
     </script>
</body>
</html>
